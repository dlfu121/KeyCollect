# Motion-capture glove teleoperator (ROS1)
type: mocap_ros

wrist_topic: /right_wrist_pose
joint_topic: /right_joint_poses
transport: auto

position_axis_map: [0, 0, 1, 1, 0, 0, 0, 1, 0]
orientation_axis_map: [0, -1, 0, 0, 0, 1, -1, 0, 0]
position_scale: 0.01
orientation_scale: 1.0
finger_scale: 1.0
pip_dip_coupling: 1.0
finger_spread_coupling: [1.0, 1.0, 1.0]

max_translation_delta_m: 0.02
max_rotation_delta_rad: 0.10
max_finger_delta_rad: 0.05
stale_timeout_s: 0.25
expected_joint_values: 57
