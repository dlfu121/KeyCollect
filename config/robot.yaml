# Robot configuration for MuJoCo simulation
# Adjust scene_path and joint names to match your robot

type: mujoco
id: rm65_dexhand

scene_path: assets/scenes/rm65_dexhand_scene.xml

arm_joint_names:
  - joint_1
  - joint_2
  - joint_3
  - joint_4
  - joint_5
  - joint_6

gripper_joint_names:
  - r_f_joint1_1
  - r_f_joint1_2
  - r_f_joint1_3
  - r_f_joint1_4
  - r_f_joint2_1
  - r_f_joint2_2
  - r_f_joint2_3
  - r_f_joint2_4
  - r_f_joint3_1
  - r_f_joint3_2
  - r_f_joint3_3
  - r_f_joint3_4
  - r_f_joint4_1
  - r_f_joint4_2
  - r_f_joint4_3
  - r_f_joint4_4
  - r_f_joint5_1
  - r_f_joint5_2
  - r_f_joint5_3
  - r_f_joint5_4

ee_site_name: ee_site

cameras:
  camera_front:
    type: opencv
    index_or_path: 0  # placeholder
    width: 480
    height: 480
    fps: 30

# Simulation
physics_dt: 0.001
control_fps: 30

# Randomize the screwdriver in the palm's right-front region.
randomize_screwdrivers: true
screwdriver_workspace_x: [-0.22, 0.02]
screwdriver_workspace_y: [-0.22, 0.04]
screwdriver_palm_front_offsets: [0.04, 0.22]
screwdriver_palm_right_offsets: [0.04, 0.20]
screwdriver_y_axis_angle_deg: [-35.0, 35.0]

# Safety
max_joint_step: 0.1
max_finger_step: 0.05
joint_limit_margin: 0.01

# IK
ik_damping: 0.05
ik_max_iterations: 50
ik_pos_tol: 0.001
ik_ori_tol: 0.01
