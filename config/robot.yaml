# Robot configuration for MuJoCo simulation
# Adjust scene_path and joint names to match your robot

type: mujoco
id: rm65_dexhand

scene_path: assets/scenes/rm65_dexhand_scene.xml

arm_joint_names:
  - joint_1
  - joint_2
  - joint_3
  - joint_4
  - joint_5
  - joint_6

gripper_joint_names:
  - r_f_joint1_1
  - r_f_joint1_2
  - r_f_joint1_3
  - r_f_joint1_4
  - r_f_joint2_1
  - r_f_joint2_2
  - r_f_joint2_3
  - r_f_joint2_4
  - r_f_joint3_1
  - r_f_joint3_2
  - r_f_joint3_3
  - r_f_joint3_4
  - r_f_joint4_1
  - r_f_joint4_2
  - r_f_joint4_3
  - r_f_joint4_4
  - r_f_joint5_1
  - r_f_joint5_2
  - r_f_joint5_3
  - r_f_joint5_4

ee_site_name: link_6

cameras:
  table_camera:
    type: opencv
    # MuJoCoRobot renders the scene camera with this dictionary's dimensions;
    # index_or_path is required by LeRobot's CameraConfig but is not opened.
    index_or_path: 0
    width: 640
    height: 480
    fps: 24
  wrist_overhead_camera:
    type: opencv
    index_or_path: 0
    width: 640
    height: 480
    fps: 24

# Simulation
physics_dt: 0.001
control_fps: 24
show_viewer: false
show_camera_panel: true
show_mapping_markers: false

# Randomize the screwdriver in the small workspace shared with recording.
randomize_screwdrivers: true
screwdriver_use_arc: false
screwdriver_workspace_x: [-0.18, -0.03]
screwdriver_workspace_y: [-0.15, 0.15]
screwdriver_palm_front_offsets: [0.04, 0.22]
screwdriver_palm_right_offsets: [-0.20, 0.20]
screwdriver_y_axis_angle_deg: [-35.0, 35.0]
screwdriver_arc_center_xy: [-0.27, -0.05]
screwdriver_arc_radius: [0.08, 0.28]
screwdriver_arc_angle_deg: [135.0, 225.0]

# Safety
max_joint_step: 0.1
max_finger_step: 0.05
joint_limit_margin: 0.01

# IK
ik_damping: 0.05
ik_max_iterations: 50
ik_pos_tol: 0.001
ik_ori_tol: 0.01
