[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot-teleoperator-keyboard-mouse"
version = "0.1.0"
description = "Keyboard+Mouse Teleoperator Plugin for LeRobot 0.6.1"
requires-python = ">=3.10"
dependencies = [
    "lerobot==0.6.1",
]

[project.optional-dependencies]
pynput-dep = ["pynput>=1.7"]

[project.entry-points."lerobot.teleoperators"]
keyboard_mouse = "lerobot_teleoperator_keyboard_mouse.keyboard_mouse:KeyboardMouseTeleop"

[tool.setuptools.packages.find]
include = ["lerobot_teleoperator_keyboard_mouse*"]
